name: Starling
options:
  bundleIdPrefix: com.lukadadiani
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 5QC5886P5V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Starling:
    type: application
    platform: iOS
    sources:
      - path: Starling
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: Starling/Starling.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Starling/Info.plist
      properties:
        CFBundleDisplayName: Starling
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Starling uses the front camera to estimate your attention and pulse so it can adapt the article to you. Camera frames never leave the device."
        NSMotionUsageDescription: "Starling uses motion to know whether you're sitting, walking or lying down."
        NSHealthShareUsageDescription: "Starling reads your heart rate from Apple Watch to sense how calm or tense you are while reading."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ANTHROPIC_API_KEY: "$(ANTHROPIC_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.starling
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
